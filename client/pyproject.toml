[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wdc-client"
description = "Device-side agent for Web Device Connections"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "websockets>=15,<16",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
wdc-client = "wdc_client.__main__:main"

[tool.setuptools]
packages = ["wdc_client"]

[tool.setuptools.dynamic]
version = { attr = "wdc_client.__version__" }

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
