# Local stand-in for the Kubernetes ingress, so the routing that production
# depends on can be exercised on one machine.
#
# What it reproduces is not load balancing — it is the *refusal* to balance. A
# device's WebSocket is a TCP connection living in one relay process, so every
# browser session for that device has to reach that same process. The device id in
# the path is the hash key that makes it happen.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Pull the device id out of the path. $uri is the normalised path *without* the
    # query string, so the grant travelling in ?grant=... can never perturb the key.
    #
    # deploy/k8s/server.yaml does the same thing with `if` + `set`, because
    # ingress-nginx injects its snippet into the location block, where `map` is not
    # allowed. Here the whole http block is ours, so `map` is available — same key,
    # fewer of nginx's sharp edges.
    map $uri $dev_id {
        default                                       "";
        ~^/(?:device|terminal|file|download)/([^/]+)  $1;
    }

    # Only send "Connection: upgrade" when the client actually asked to upgrade,
    # so plain HTTP calls to /devices and /health still work through here.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream relay {
        # Consistent hashing (ketama), not modulo: adding or removing a replica
        # moves a fraction of the devices instead of remapping every one of them.
        #
        # /health and /devices hash on an empty key, so they land on whichever
        # single replica the empty string maps to. That is harmless — presence is
        # shared, so any replica answers for the whole fleet. Use ports 8001-8003
        # to reach a specific replica.
        hash $dev_id consistent;

        server relay-a:8000;
        server relay-b:8000;
        server relay-c:8000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://relay;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            # The relay checks Origin on every upgrade, so it has to survive the hop.
            proxy_set_header Origin     $http_origin;

            # Terminal sessions sit idle for long stretches while nobody types.
            # The 60s default would cut them mid-session.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;

            client_max_body_size 100m;

            # Debugging aid with no production equivalent: shows which replica the
            # hash chose, and on what key. Handy for watching affinity hold.
            add_header X-Relay-Upstream $upstream_addr always;
            add_header X-Relay-Hash-Key $dev_id        always;
        }
    }
}
